name: "Update Embedded Schemas"

# Hosted Renovate cannot run the arbitrary downloads needed to vendor these files.
# This workflow creates the PR and verifies its contents before using gh to merge it.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-embedded-schemas
  cancel-in-progress: false

jobs:
  update:
    name: "Refresh and verify schemas"
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UPDATE_BRANCH: automation/embedded-schemas

    steps:
      - name: "Checkout default branch."
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: "Download and validate latest schemas."
        id: schemas
        run: |
          revision=$(gh api repos/SchemaStore/schemastore/commits/master --jq .sha)
          bash .github/scripts/update-schemas.sh "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet -- modules/ghlint-jsonschema/src/main/resources; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: "Open or update schema pull request."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        id: pr
        env:
          REVISION: ${{ steps.schemas.outputs.revision }}
        run: |
          previous=$(git ls-remote origin "refs/heads/${UPDATE_BRANCH}" | cut -f1)
          git switch -c "${UPDATE_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/ghlint-jsonschema/src/main/resources/net/twisterrob/ghlint/yaml/schemas
          git commit -m "Update embedded SchemaStore schemas"
          git push --force-with-lease="refs/heads/${UPDATE_BRANCH}:${previous}" origin "HEAD:${UPDATE_BRANCH}"
          head=$(git rev-parse HEAD)
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          body_file="${RUNNER_TEMP}/schema-pr.md"
          cat > "${body_file}" <<EOF
          Refresh the bundled workflow and action schemas from [SchemaStore at ${REVISION}](https://github.com/SchemaStore/schemastore/commit/${REVISION}).

          This workflow runs the full build and checks the JUnit results before enabling auto-merge for this exact commit.
          EOF
          url=$(gh pr list --head "${UPDATE_BRANCH}" --base "${BASE_BRANCH}" --json url --jq '.[0].url // empty')
          if [[ -z "${url}" ]]; then
            url=$(gh pr create --head "${UPDATE_BRANCH}" --base "${BASE_BRANCH}" \
              --title "Update embedded SchemaStore schemas" --body-file "${body_file}")
          else
            gh pr edit "${url}" --body-file "${body_file}"
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: "Set up Java."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: temurin

      - name: "Set up Gradle."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Run validation here because PRs opened with GITHUB_TOKEN do not run CI unattended.
      - name: "Build and verify updated schemas."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        run: ./gradlew --no-daemon build

      # Tests deliberately use ignoreFailures on CI; inspect the XML before merging.
      - name: "Require passing unit test results."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        run: |
          mapfile -d '' reports < <(find modules -type f -path '*/build/test-results/test/TEST-*.xml' -print0)
          if (( ${#reports[@]} == 0 )); then
            echo "::error::No unit test reports found."
            exit 1
          fi
          if grep -l -E '<testsuite[^>]*(failures|errors)="[1-9][0-9]*"' "${reports[@]}"; then
            echo "::error::Unit tests failed."
            exit 1
          fi

      - name: "Auto-merge the verified schema update."
        if: ${{ steps.schemas.outputs.changed == 'true' }}
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: gh pr merge "${PR_URL}" --auto --squash --match-head-commit "${PR_HEAD}"
